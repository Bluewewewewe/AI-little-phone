<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI小手机</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- 桌面端外层容器 -->
  <div id="desktop">
    <!-- 左侧信息面板 -->
    <div id="infoPanel">
      <!-- 卡片1: 等级+章节 -->
      <div class="info-card">
        <div class="info-card-title">⭐ 等级</div>
        <div class="level-row">
          <span class="level-badge">Lv.1</span>
          <span class="chapter-badge">Ch1 · 地下秘密</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:15%"></div>
        </div>
        <div class="progress-label">距离 Lv.2 还需 85 经验</div>
      </div>
      <!-- 卡片2: 亲密度 -->
      <div class="info-card">
        <div class="info-card-title">💖 亲密度</div>
        <div class="intimacy-row">
          <div class="intimacy-item">
            <span class="intimacy-name" style="color:#f59e0b">👨 爸爸</span>
            <div class="intimacy-bar"><div class="intimacy-fill" style="width:12%;background:#f59e0b"></div></div>
            <span class="intimacy-val">12</span>
          </div>
          <div class="intimacy-item">
            <span class="intimacy-name" style="color:#ec4899">👩 妈妈</span>
            <div class="intimacy-bar"><div class="intimacy-fill" style="width:8%;background:#ec4899"></div></div>
            <span class="intimacy-val">8</span>
          </div>
        </div>
      </div>
      <!-- 卡片3: 宠物健康 (Ch2解锁) -->
      <div class="info-card" id="petHealthCard" style="display:none">
        <div class="info-card-title">🐾 宠物健康</div>
        <div class="pet-row">
          <div class="pet-item">🐕 辛巴 <span class="pet-hp" style="color:#22c55e">90</span></div>
          <div class="pet-item">🐱 大鱼 <span class="pet-hp" style="color:#22c55e">85</span></div>
          <div class="pet-item">🐱 小十一 <span class="pet-hp" style="color:#eab308">70</span></div>
        </div>
      </div>
    </div>

    <!-- 手机框 -->
    <div id="phoneFrame">
      <div id="phoneScreen">
        <!-- 主屏幕 -->
        <div id="homeScreen">
          <div id="statusBar">
            <span id="clock">--:--</span>
            <span class="status-right">📶 🔋 100%</span>
          </div>
          <div id="homeContent">
            <!-- 大时钟+日期 -->
            <div id="bigClock">
              <div id="bigTime">--:--</div>
              <div id="bigDate"></div>
            </div>
            <!-- 爸妈状态小组件 -->
            <div id="parentWidgets">
              <div class="parent-widget" id="dadWidget">
                <span class="parent-emoji">👨</span>
                <div class="parent-info">
                  <span class="parent-name">爸爸</span>
                  <span class="parent-status" id="dadStatus">🟢 在家</span>
                </div>
                <span class="parent-desc" id="dadDesc">起床做早餐</span>
              </div>
              <div class="parent-widget" id="momWidget">
                <span class="parent-emoji">👩</span>
                <div class="parent-info">
                  <span class="parent-name">妈妈</span>
                  <span class="parent-status" id="momStatus">💤 睡觉</span>
                </div>
                <span class="parent-desc" id="momDesc">赖床中</span>
              </div>
            </div>
            <!-- APP图标网格 -->
            <div id="appGridWrapper">
              <div id="appGridSlider">
                <!-- 第1页：8个APP -->
                <div class="app-page" data-page="0">
                  <div class="app-icon" data-app="family" style="--app-color:#22c55e"><span class="app-emoji">💬</span><span class="app-label">家庭群</span></div>
                  <div class="app-icon" data-app="dad" style="--app-color:#f59e0b"><span class="app-emoji">👨</span><span class="app-label">爸爸</span></div>
                  <div class="app-icon" data-app="mom" style="--app-color:#ec4899"><span class="app-emoji">👩</span><span class="app-label">妈妈</span></div>
                  <div class="app-icon" data-app="moments" style="--app-color:#f97316"><span class="app-emoji">🌅</span><span class="app-label">朋友圈</span></div>
                  <div class="app-icon" data-app="weibo" style="--app-color:#ef4444"><span class="app-emoji">📱</span><span class="app-label">微博</span></div>
                  <div class="app-icon" data-app="home" style="--app-color:#92400e"><span class="app-emoji">🏠</span><span class="app-label">家里</span></div>
                  <div class="app-icon" data-app="pet" style="--app-color:#10b981"><span class="app-emoji">🐾</span><span class="app-label">宠物</span></div>
                  <div class="app-icon" data-app="dressup" style="--app-color:#a855f7"><span class="app-emoji">👗</span><span class="app-label">换装</span></div>
                </div>
                <!-- 第2页：4个APP -->
                <div class="app-page" data-page="1">
                  <div class="app-icon" data-app="me" style="--app-color:#3b82f6"><span class="app-emoji">👤</span><span class="app-label">我的</span></div>
                  <div class="app-icon" data-app="call" style="--app-color:#06b6d4"><span class="app-emoji">📞</span><span class="app-label">通话</span></div>
                  <div class="app-icon" data-app="browser" style="--app-color:#6366f1"><span class="app-emoji">🌐</span><span class="app-label">浏览器</span></div>
                  <div class="app-icon" data-app="music" style="--app-color:#ec4899"><span class="app-emoji">🎵</span><span class="app-label">音乐</span></div>
                </div>
              </div>
              <!-- 分页指示点 -->
              <div id="pageDots">
                <span class="dot active" data-dot="0"></span>
                <span class="dot" data-dot="1"></span>
              </div>
            </div>
          </div>
          <!-- Dock栏 -->
          <div id="dock">
            <div class="dock-icon" data-app="call" style="--app-color:#06b6d4"><span class="app-emoji">📞</span></div>
            <div class="dock-icon" data-app="browser" style="--app-color:#6366f1"><span class="app-emoji">🌐</span></div>
            <div class="dock-icon" data-app="music" style="--app-color:#ec4899"><span class="app-emoji">🎵</span></div>
            <div class="dock-icon" data-app="family" style="--app-color:#22c55e"><span class="app-emoji">💬</span></div>
          </div>
          <!-- Home Indicator -->
          <div id="homeIndicator"></div>
        </div>

        <!-- APP全屏层 -->
        <div id="appLayer" style="display:none">
          <div id="appHeader">
            <button id="appBack">← 返回</button>
            <span id="appTitle"></span>
          </div>
          <div id="appContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
