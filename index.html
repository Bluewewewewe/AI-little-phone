<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>AI 小手机</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>

  <!-- ===== 主屏幕 ===== -->
  <div id="homeScreen" class="screen active">

    <!-- 壁纸 -->
    <div class="wallpaper"></div>

    <!-- 状态栏 -->
    <header class="status-bar">
      <span id="statusTime" class="status-time">--:--</span>
      <div class="status-right">
        <span>📶</span>
        <span class="battery">🔋 100%</span>
      </div>
    </header>

    <!-- 图标网格滑动区域 -->
    <div id="gridContainer" class="grid-container">
      <div id="gridSlider" class="grid-slider">
        <!-- 页面1 -->
        <div class="grid-page" data-page="0">
          <div class="icon-grid">
            <button class="app-icon" data-app="phone"><span class="icon-emoji">📞</span><span class="icon-label">电话</span></button>
            <button class="app-icon" data-app="browser"><span class="icon-emoji">🌐</span><span class="icon-label">浏览器</span></button>
            <button class="app-icon" data-app="music"><span class="icon-emoji">🎵</span><span class="icon-label">音乐</span></button>
            <button class="app-icon" data-app="messages"><span class="icon-emoji">💬</span><span class="icon-label">信息</span></button>
            <button class="app-icon" data-app="camera"><span class="icon-emoji">📷</span><span class="icon-label">相机</span></button>
            <button class="app-icon" data-app="photos"><span class="icon-emoji">🖼️</span><span class="icon-label">照片</span></button>
            <button class="app-icon" data-app="maps"><span class="icon-emoji">🗺️</span><span class="icon-label">地图</span></button>
            <button class="app-icon" data-app="weather"><span class="icon-emoji">🌤️</span><span class="icon-label">天气</span></button>
            <button class="app-icon" data-app="clock"><span class="icon-emoji">⏰</span><span class="icon-label">时钟</span></button>
            <button class="app-icon" data-app="calculator"><span class="icon-emoji">🧮</span><span class="icon-label">计算器</span></button>
            <button class="app-icon" data-app="notes"><span class="icon-emoji">📝</span><span class="icon-label">备忘录</span></button>
            <button class="app-icon" data-app="settings"><span class="icon-emoji">⚙️</span><span class="icon-label">设置</span></button>
            <button class="app-icon" data-app="calendar"><span class="icon-emoji">📅</span><span class="icon-label">日历</span></button>
            <button class="app-icon" data-app="mail"><span class="icon-emoji">✉️</span><span class="icon-label">邮件</span></button>
            <button class="app-icon" data-app="files"><span class="icon-emoji">📁</span><span class="icon-label">文件</span></button>
            <button class="app-icon" data-app="health"><span class="icon-emoji">❤️</span><span class="icon-label">健康</span></button>
          </div>
        </div>
        <!-- 页面2 -->
        <div class="grid-page" data-page="1">
          <div class="icon-grid">
            <button class="app-icon" data-app="wallet"><span class="icon-emoji">💳</span><span class="icon-label">钱包</span></button>
            <button class="app-icon" data-app="appstore"><span class="icon-emoji">🛒</span><span class="icon-label">商店</span></button>
            <button class="app-icon" data-app="family"><span class="icon-emoji">👨‍👩‍👧</span><span class="icon-label">家庭</span></button>
            <button class="app-icon" data-app="pets"><span class="icon-emoji">🐾</span><span class="icon-label">宠物</span></button>
            <button class="app-icon" data-app="moments"><span class="icon-emoji">📸</span><span class="icon-label">朋友圈</span></button>
            <button class="app-icon" data-app="weibo"><span class="icon-emoji">🔥</span><span class="icon-label">微博</span></button>
            <button class="app-icon" data-app="dressup"><span class="icon-emoji">👗</span><span class="icon-label">换装</span></button>
            <button class="app-icon" data-app="stories"><span class="icon-emoji">📖</span><span class="icon-label">故事</span></button>
          </div>
        </div>
      </div>
    </div>

    <!-- 分页指示点 -->
    <div id="pageDots" class="page-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>

    <!-- Dock 栏 -->
    <nav class="dock">
      <button class="dock-icon" data-app="phone"><span class="icon-emoji">📞</span></button>
      <button class="dock-icon" data-app="browser"><span class="icon-emoji">🌐</span></button>
      <button class="dock-icon" data-app="music"><span class="icon-emoji">🎵</span></button>
      <button class="dock-icon" data-app="messages"><span class="icon-emoji">💬</span></button>
    </nav>

    <!-- Home Indicator -->
    <div class="home-indicator">
      <div class="indicator-bar"></div>
    </div>
  </div>

  <!-- ===== APP 全屏内容区 ===== -->
  <div id="appScreen" class="screen">
    <button id="backBtn" class="back-btn">← 返回</button>
    <div id="appContent"></div>
  </div>

  <script src="/scripts/main.js"></script>
</body>
</html>
